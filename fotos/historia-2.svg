<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Ilustração: fila na calçada em frente à janela de pedidos (pessoas de costas, sem rostos). -->
  <rect width="400" height="500" fill="#0636A6"/>
  <!-- parede de tijolos -->
  <rect x="0" y="0" width="400" height="390" fill="#E01A12"/>
  <g stroke="#B30F09" stroke-width="3">
    <path d="M0 30 H400 M0 70 H400 M0 110 H400 M0 290 H400 M0 330 H400 M0 370 H400"/>
    <path d="M40 0 v30 M120 0 v30 M200 0 v30 M280 0 v30 M360 0 v30 M80 30 v40 M160 30 v40 M240 30 v40 M320 30 v40 M40 70 v40 M120 70 v40 M200 70 v40 M280 70 v40 M360 70 v40"/>
    <path d="M60 290 v40 M140 290 v40 M220 290 v40 M300 290 v40 M100 330 v40 M180 330 v40 M260 330 v40 M340 330 v40"/>
  </g>

  <!-- placa PEDIDOS -->
  <rect x="96" y="34" width="208" height="54" rx="10" fill="#0B4FDE" stroke="#0E0E14" stroke-width="6"/>
  <text x="202" y="73" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="30" fill="#0E0E14">PEDIDOS</text>
  <text x="200" y="71" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="30" fill="#FFF4E2">PEDIDOS</text>

  <!-- janela de pedidos acesa -->
  <rect x="60" y="112" width="280" height="160" rx="8" fill="#FFC21A" stroke="#0E0E14" stroke-width="6"/>
  <g fill="#D99A00">
    <circle cx="150" cy="168" r="18"/><rect x="128" y="186" width="44" height="60" rx="16"/>
    <rect x="220" y="150" width="70" height="40" rx="6"/>
  </g>
  <rect x="236" y="160" width="38" height="8" rx="3" fill="#FFF4E2"/>
  <rect x="236" y="174" width="26" height="8" rx="3" fill="#FFF4E2"/>
  <rect x="48" y="262" width="304" height="18" rx="4" fill="#FFF4E2" stroke="#0E0E14" stroke-width="5"/>
  <g stroke="#0E0E14" stroke-width="3" fill="#E01A12">
    <rect x="110" y="246" width="22" height="16" rx="3"/><rect x="268" y="246" width="22" height="16" rx="3"/>
  </g>

  <!-- calçada -->
  <rect x="0" y="390" width="400" height="110" fill="#2b2b3d"/>
  <path d="M0 390 H400" stroke="#0E0E14" stroke-width="6"/>
  <path d="M0 440 H400" stroke="#3a3a52" stroke-width="3"/>
  <g fill="#0E0E14" opacity=".45">
    <ellipse cx="70" cy="468" rx="34" ry="8"/><ellipse cx="150" cy="466" rx="34" ry="8"/><ellipse cx="232" cy="468" rx="34" ry="8"/>
    <ellipse cx="312" cy="466" rx="34" ry="8"/>
  </g>

  <!-- pessoas na fila, de costas -->
  <g stroke="#0E0E14" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 1 -->
    <path d="M58 466 v-46 M82 466 v-46" />
    <rect x="44" y="340" width="52" height="88" rx="20" fill="#0B4FDE"/>
    <circle cx="70" cy="318" r="22" fill="#8A5A3A"/>
    <path d="M48 310 q22 -26 44 0 q-22 -10 -44 0 z" fill="#0E0E14"/>
    <!-- 2 -->
    <path d="M138 466 v-50 M162 466 v-50"/>
    <rect x="122" y="330" width="56" height="94" rx="22" fill="#FFF4E2"/>
    <circle cx="150" cy="306" r="22" fill="#E8B98A"/>
    <path d="M126 302 q24 -30 48 0 v14 q-6 -18 -24 -18 q-18 0 -24 18 z" fill="#B30F09"/>
    <!-- 3 -->
    <path d="M220 466 v-44 M244 466 v-44"/>
    <rect x="206" y="346" width="52" height="84" rx="20" fill="#FFC21A"/>
    <circle cx="232" cy="324" r="21" fill="#5C3A26"/>
    <rect x="212" y="300" width="40" height="12" rx="6" fill="#0B4FDE"/>
    <!-- 4 -->
    <path d="M300 466 v-48 M324 466 v-48"/>
    <rect x="286" y="336" width="52" height="90" rx="20" fill="#0E0E14"/>
    <circle cx="312" cy="312" r="22" fill="#C68A5A"/>
    <path d="M290 306 q22 -28 44 0 q-4 -6 -22 -8 q-18 2 -22 8 z" fill="#3a2418"/>
    <circle cx="312" cy="286" r="9" fill="#3a2418"/>
  </g>
  <!-- conversa -->
  <g stroke="#0E0E14" stroke-width="4" fill="#FFF4E2">
    <path d="M168 270 h56 a10 10 0 0 1 10 10 v14 a10 10 0 0 1 -10 10 h-30 l-12 12 v-12 h-14 a10 10 0 0 1 -10 -10 v-14 a10 10 0 0 1 10 -10 z" transform="translate(-2 -20)"/>
  </g>
  <g fill="#0E0E14"><circle cx="182" cy="267" r="3.5"/><circle cx="196" cy="267" r="3.5"/><circle cx="210" cy="267" r="3.5"/></g>
</svg>
