      <stop offset="0" stop-color="#06205f"/>
      <stop offset="1" stop-color="#0B4FDE"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFC21A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFC21A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#ceu)"/>
  <g fill="#FFF4E2">
